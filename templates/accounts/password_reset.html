{% extends 'base.html' %}
{% load static %}

{% block extra_css %}<link rel="stylesheet" href="{% static 'css/password_reset.css' %}">{% endblock %}
{% block title %}Reset Password | NepCart{% endblock %}

{% block content %}
<section class="auth-page password-reset-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Password reset</h1>
            <p>Contact support to reset your NepCart password.</p>
        </div>
        <a class="auth-submit" href="mailto:support@nepcart.com">Contact Support</a>
    </div>
</section>
{% endblock %}
