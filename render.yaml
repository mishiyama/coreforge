services:
  - type: web
    name: coreforge
    runtime: python
    plan: free
    region: singapore
    buildCommand: "./build.sh"
    preDeployCommand: "python manage.py migrate --noinput && python manage.py seed_catalog"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: "/healthz/"
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: SERVE_MEDIA_LOCALLY
        value: "True"
      - key: ESEWA_PRODUCT_CODE
        sync: false
      - key: ESEWA_SECRET_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      - key: AWS_STORAGE_REGION_NAME
        sync: false
      - key: AWS_S3_ADDRESSING_STYLE
        sync: false
